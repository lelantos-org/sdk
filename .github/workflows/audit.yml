name: Audit

# Auditing needs the two lockfiles and the advisory databases, not `dist/` or
# the WASM `pkg/` output, so it runs alongside `ci.yml`.
#
# Also scheduled: a new advisory lands against an unchanged lockfile more often
# than a dependency changes, and a push-only audit would miss it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 05:17 UTC daily. Off the hour: GitHub drops scheduled runs under load,
    # most often at the top of the hour.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps
        with:
          npm-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # Production deps only. The `@lelantos-org/*` dev dependencies come from
      # GitHub Packages, which serves no registry signatures and no
      # `/-/npm/v1/keys` endpoint, so npm cannot verify them and the audit
      # would fail on them alone. Everything that ships to consumers comes
      # from npmjs and is verified here.
      - name: Audit npm package signatures
        run: npm audit signatures --omit=dev

      # Two thresholds. Everything under `--omit=dev` runs in a consumer's
      # wallet, so any advisory fails the run. The dev tree is build- and
      # test-only, so it fails at `high` and reports below that. Run
      # `npm audit fix` locally when this trips.
      - name: "Audit npm dependencies (prod: any, full tree: high)"
        run: npm run check:audit

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo audit` reads `wasm/Cargo.lock` and the RustSec database without
      # building, so the runner's stock stable toolchain is enough.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # The Rust tree compiles into the `.wasm` shipped to consumers, so an
      # advisory fails the run, as for the prod npm tree. Exceptions live in
      # `wasm/.cargo/audit.toml`, which cargo-audit resolves relative to the
      # working directory. Run from `wasm/` directly, not through the
      # `check:audit:wasm` npm script, so this job needs no `npm ci`.
      - name: Audit Rust dependencies
        working-directory: wasm
        run: cargo audit
