name: CI

# Static lints live in `lint.yml` and dependency auditing in `audit.yml`; both
# run without a Rust toolchain, in parallel with this workflow.
#
# This workflow holds everything that needs the compiled WASM packages. They
# are built once in `wasm` and passed to the three consumers as an artifact, so
# the build, test and bench jobs run concurrently. Artifacts are scoped to a
# run, so separate workflows would each rebuild the WASM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `npm ci` pulls `@lelantos-org/circuits` and `@lelantos-org/contracts` from
# GitHub Packages. Without this block the fallback `GITHUB_TOKEN` inherits the
# org's default workflow permissions, which may omit `packages` and 401.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds `wasm/*/pkg` and uploads it as an artifact. Every job below `needs:`
  # this.
  wasm:
    name: "WASM build"
    runs-on: ubuntu-latest
    env:
      # Pinned at job level: the install step and the WASM package cache key
      # below must use the same version.
      BINARYEN_VERSION: "132"
      BINARYEN_SHA256: "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572"
    steps:
      - uses: actions/checkout@v4

      # `HEAD:wasm` is the git tree id of `wasm/` as committed, so it changes
      # exactly when a tracked file under it does. `hashFiles('wasm/**')` would
      # also walk `wasm/target/`, which `Swatinem/rust-cache` restores below and
      # whose build-script output is not reproducible run to run.
      - name: Identify the WASM source tree
        id: wasm-tree
        run: echo "id=$(git rev-parse HEAD:wasm)" >> "$GITHUB_OUTPUT"

      # The three `pkg/` directories are a function of that tree, the toolchain
      # it pins and the binaryen version in the key, and nothing else in this
      # job writes to them, so a run that touches no Rust restores them and
      # skips the build. `Swatinem/rust-cache` covers `target/` but not the
      # `wasm-bindgen` and `wasm-opt` passes.
      - name: Cache built WASM packages
        id: wasm-pkg
        uses: actions/cache@v4
        with:
          path: |
            wasm/prover/pkg
            wasm/jubjub/pkg
            wasm/poseidon/pkg
          key: wasm-pkg-${{ runner.os }}-binaryen${{ env.BINARYEN_VERSION }}-${{ steps.wasm-tree.outputs.id }}

      # Every toolchain step below runs only on a cache miss.
      - uses: rui314/setup-mold@v1
        if: steps.wasm-pkg.outputs.cache-hit != 'true'

      # The nightly is pinned only in `wasm/rust-toolchain.toml`.
      - name: Read pinned toolchain
        id: toolchain
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' wasm/rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rust-src
          target: wasm32-unknown-unknown
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        with:
          workspaces: wasm

      - uses: taiki-e/install-action@v2
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        with:
          tool: wasm-pack

      # wasm-pack uses `wasm-opt` from PATH and otherwise downloads a pinned
      # binaryen from GitHub releases, a fetch with no retry that is unreliable
      # from hosted runners. All three crates set `wasm-opt` flags (`-O4`, and
      # SIMD/threads where the crate uses them) and the build is size-budgeted,
      # so the optimiser cannot be skipped. Keep this before any `just build`.
      #
      # Not `apt-get install binaryen`: the runners' `azure.archive.ubuntu.com`
      # mirrorlist intermittently stalls `apt-get update`, and noble ships
      # binaryen 116. The upstream release tarball is pinned by version and
      # sha256, and the download is retried.
      - name: Install binaryen (provides wasm-opt)
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="version_${BINARYEN_VERSION}"
          tarball="binaryen-${tag}-x86_64-linux.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/WebAssembly/binaryen/releases/download/${tag}/${tarball}"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${tag}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-${tag}/bin/wasm-opt" --version

      - uses: extractions/setup-just@v2
        if: steps.wasm-pkg.outputs.cache-hit != 'true'

      - name: Build WASM crates
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        run: cd wasm && just build

      # Reads only the three `_bg.wasm` files. Runs on a cache hit too, so a
      # lowered limit in the script takes effect.
      - name: WASM size budget
        run: node scripts/check-wasm-size.mjs

      # The three paths share the `wasm/` prefix, so the artifact is rooted
      # there and `path: wasm` on the download side restores them in place.
      - name: Upload WASM packages
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: |
            wasm/prover/pkg
            wasm/jubjub/pkg
            wasm/poseidon/pkg
          if-no-files-found: error
          retention-days: 1

  # Type-check, compile, and everything that inspects the compiled `dist/`.
  build:
    name: "Build and package checks"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps
        with:
          npm-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download WASM packages
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm

      - name: Type check (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Size budgets (dist total and each entry's eager graph), the public API diff, publint/attw
      # and the packed raw assets.
      - name: Package checks
        run: npm run check:dist

  # Unit suite. Runs from `src/`, but `runtime/wasm/rayon/exit.test.ts` drives a child process
  # against `dist/` and skips itself when it is absent, so build first.
  test:
    name: "Unit tests"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps
        with:
          npm-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download WASM packages
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm

      - name: Build (the rayon exit tests run against dist/)
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # The slowest job, kept separate so it runs alongside `build` and `test`.
  bench:
    name: "Prover parity"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps
        with:
          npm-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download WASM packages
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm

      # The only step that runs the Rust prover and verifies its output against
      # the companion's verification key, for both shapes; `npm test` excludes
      # `*.bench.ts`. Without it nothing in CI would catch a wasm prover that
      # produces invalid proofs.
      - name: "Prover parity (wasm vs snarkjs, both shapes)"
        run: npm run test:bench

  # Single stable check for branch protection: a required status named `CI`
  # points here whatever the jobs above are called. `always()` makes a skipped
  # or cancelled upstream job fail the gate instead of skipping it.
  ci:
    name: CI
    if: always()
    needs: [wasm, build, test, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
