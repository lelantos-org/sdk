name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: rust-src
          target: wasm32-unknown-unknown
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: jetli/wasm-pack-action@v0.4.0

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: npm ci

      - name: Build WASM crates
        run: cd wasm && just build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: WASM size budget
        run: node scripts/check-wasm-size.mjs

      - name: Verify packed contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0];
            const need = [
              "wasm/jubjub/pkg/jubjub_wasm.js",
              "wasm/jubjub/pkg/jubjub_wasm_bg.wasm",
              "wasm/jubjub/pkg/jubjub_wasm.d.ts",
              "wasm/prover/pkg/prover.js",
              "wasm/prover/pkg/prover_bg.wasm",
              "wasm/prover/pkg/prover.d.ts",
              "dist/wasm/rayon-worker-bootstrap.mjs",
              "dist/index.js",
            ];
            const got = new Set(j.files.map(f => f.path));
            const miss = need.filter(p => !got.has(p));
            if (miss.length) { console.error("missing from npm package:", miss); process.exit(1); }
            console.log("npm pack: all required files present");
          '
