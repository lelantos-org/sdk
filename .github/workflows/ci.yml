name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `npm ci` pulls `@lelantos-org/circuits` and `@lelantos-org/contracts` from
# GitHub Packages. Without this block the fallback `GITHUB_TOKEN` inherits the
# org's default workflow permissions, which may omit `packages` and 401.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Pinned here rather than on the install step: the WASM package cache key
      # below names the same version, and the two must not drift.
      BINARYEN_VERSION: "132"
      BINARYEN_SHA256: "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: rust-src
          target: wasm32-unknown-unknown
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # wasm-pack uses `wasm-opt` from PATH when it can find one, and otherwise
      # downloads a pinned binaryen from GitHub releases — a fetch that is not
      # reliable from hosted runners and has no retry. All three crates set
      # load-bearing `wasm-opt` flags (`-O4`, and SIMD/threads where the crate
      # uses them) and the build is
      # size-budgeted, so skipping the optimiser is not an option; installing it
      # is. Keep this before any `just build`.
      #
      # Not `apt-get install binaryen`: the runners' `azure.archive.ubuntu.com`
      # mirrorlist intermittently stalls `apt-get update` for tens of minutes
      # with no retry cap, and noble ships binaryen 116. Fetch the upstream
      # release tarball instead — pinned by version and sha256, retried, ~2s.
      - name: Install binaryen (provides wasm-opt)
        run: |
          set -euo pipefail
          tag="version_${BINARYEN_VERSION}"
          tarball="binaryen-${tag}-x86_64-linux.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/WebAssembly/binaryen/releases/download/${tag}/${tarball}"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${tag}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-${tag}/bin/wasm-opt" --version

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # Production deps only. The tree's one GitHub Packages dependency
      # (`@lelantos-org/circuits`, dev-only) cannot be signature-verified:
      # GitHub Packages serves no registry signatures and no
      # `/-/npm/v1/keys` endpoint, so npm cannot fetch verification keys for
      # it and the audit fails on that package alone. Everything that ships
      # to consumers comes from npmjs and is still verified here.
      - name: Audit npm package signatures
        run: npm audit signatures --omit=dev

      # Git already hashes the tree: `HEAD:wasm` is the id of the `wasm/`
      # directory as committed, so it changes exactly when a tracked file under
      # it does. `hashFiles('wasm/**')` would instead walk `wasm/target/`, which
      # `Swatinem/rust-cache` restores above and whose build-script output is not
      # reproducible run to run.
      - name: Identify the WASM source tree
        id: wasm-tree
        run: echo "id=$(git rev-parse HEAD:wasm)" >> "$GITHUB_OUTPUT"

      # The three `pkg/` directories are a pure function of that tree plus the
      # toolchain and binaryen — both pinned by files inside it, bar the version
      # in the key — and nothing else in this job writes to them. So on a run
      # that touches no Rust, restoring them skips the build outright.
      # `Swatinem/rust-cache` covers `target/`, but not `wasm-bindgen` or
      # `wasm-opt`, which is the rest of the wall clock.
      - name: Cache built WASM packages
        id: wasm-pkg
        uses: actions/cache@v4
        with:
          path: |
            wasm/prover/pkg
            wasm/jubjub/pkg
            wasm/poseidon/pkg
          key: wasm-pkg-${{ runner.os }}-binaryen${{ env.BINARYEN_VERSION }}-${{ steps.wasm-tree.outputs.id }}

      - name: Build WASM crates
        if: steps.wasm-pkg.outputs.cache-hit != 'true'
        run: cd wasm && just build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: "Browser-safety lint (no node: imports under src/)"
        run: npm run check:browser-safe

      - name: "Layer lint (tier ladder + no export *)"
        run: npm run check:layers

      - name: "WASM subpath lint (literal #wasm/* specifiers)"
        run: npm run check:wasm-imports

      - name: Sync version
        run: node scripts/sync-version.mjs

      - name: Type check (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle-size

      - name: "Per-entry eager bundle budget"
        run: npm run check:bundle-budget

      - name: "Public API surface (diff against api-surface.json)"
        run: npm run check:api

      - name: "Docs type-check (README + SDK.md code blocks)"
        run: npm run check:docs

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # The only coverage that runs the Rust prover and verifies its output
      # against the companion's verification key, for both shapes. `npm test`
      # excludes `*.bench.ts` to stay fast, so without this step nothing in CI
      # would catch a wasm prover that produces invalid proofs.
      - name: "Prover parity (wasm vs snarkjs, both shapes)"
        run: npm run test:bench

      - name: WASM size budget
        run: node scripts/check-wasm-size.mjs

      - name: Publish hygiene (publint + attw)
        run: npm run check:publish

      - name: Verify packed contents
        run: npm run check:pack
