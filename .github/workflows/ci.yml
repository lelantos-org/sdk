name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: rust-src
          target: wasm32-unknown-unknown
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: extractions/setup-just@v2

      # `@lelantos-org/circuits` is a devDependency on GitHub Packages (the
      # circuit vectors the parity suite reads), so the install needs a token
      # with `read:packages`. GITHUB_TOKEN suffices while the circuits package
      # grants this repo read access; otherwise set a PAT in
      # `secrets.PACKAGES_READ_TOKEN`.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Audit npm package signatures
        run: npm audit signatures

      - name: Build WASM crates
        run: cd wasm && just build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: "Browser-safety lint (no node: imports under src/)"
        run: npm run check:browser-safe

      - name: "Layer lint (tier ladder + no export *)"
        run: npm run check:layers

      - name: Sync version
        run: node scripts/sync-version.mjs

      - name: Type check (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle-size

      - name: "Public API surface (diff against api-surface.json)"
        run: npm run check:api

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: WASM size budget
        run: node scripts/check-wasm-size.mjs

      - name: Publish hygiene (publint + attw)
        run: npm run check:publish

      - name: Verify packed contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0];
            const need = [
              "wasm/jubjub/pkg/jubjub_wasm.js",
              "wasm/jubjub/pkg/jubjub_wasm_bg.wasm",
              "wasm/jubjub/pkg/jubjub_wasm.d.ts",
              "wasm/prover/pkg/prover.js",
              "wasm/prover/pkg/prover_bg.wasm",
              "wasm/prover/pkg/prover.d.ts",
              "dist/wasm/rayon-worker-bootstrap.mjs",
              "dist/index.js",
            ];
            const got = new Set(j.files.map(f => f.path));
            const miss = need.filter(p => !got.has(p));
            if (miss.length) { console.error("missing from npm package:", miss); process.exit(1); }
            console.log("npm pack: all required files present");
          '
