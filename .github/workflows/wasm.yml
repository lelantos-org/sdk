name: WASM

on:
  push:
    branches: [main]
    paths:
      - "wasm/**"
      - ".github/workflows/wasm.yml"
  pull_request:
    branches: [main]
    paths:
      - "wasm/**"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wasm

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      # The nightly is pinned once, in `wasm/rust-toolchain.toml`; rustup
      # honours it for every cargo call under `wasm/`, so restating it here
      # could only drift from it.
      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      # The nightly is pinned once, in `wasm/rust-toolchain.toml`; rustup
      # honours it for every cargo call under `wasm/`, so restating it here
      # could only drift from it.
      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rust-src
          target: wasm32-unknown-unknown
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: extractions/setup-just@v2
      - run: just clippy