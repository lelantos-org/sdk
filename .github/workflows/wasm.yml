name: WASM

on:
  push:
    branches: [main]
    paths:
      - "wasm/**"
      - ".github/workflows/wasm.yml"
  pull_request:
    branches: [main]
    paths:
      - "wasm/**"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: wasm

jobs:
  fmt:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: rustfmt
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  clippy:
    needs: fmt
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: clippy, rust-src
          target: wasm32-unknown-unknown
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: extractions/setup-just@v2
      - run: just clippy

# `build` + size moved to .github/workflows/ci.yml so the Node parity
# tests run against freshly-built artifacts on every PR. This workflow
# keeps only Rust-specific gates (fmt, clippy).
