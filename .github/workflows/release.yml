name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rui314/setup-mold@v1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: rust-src
          target: wasm32-unknown-unknown
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # See ci.yml: wasm-pack downloads binaryen when `wasm-opt` is not on
      # PATH, and that download is unreliable from hosted runners.
      - name: Install binaryen (provides wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - uses: extractions/setup-just@v2

      - name: Build WASM crates
        working-directory: wasm
        run: just build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@lelantos-org"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build TypeScript
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
