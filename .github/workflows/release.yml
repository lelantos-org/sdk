name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rui314/setup-mold@v1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-06-23
          components: rust-src
          target: wasm32-unknown-unknown
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # See ci.yml: wasm-pack downloads binaryen when `wasm-opt` is not on
      # PATH, and that download is unreliable from hosted runners. Fetched from
      # upstream releases rather than apt — see ci.yml for why.
      - name: Install binaryen (provides wasm-opt)
        env:
          BINARYEN_VERSION: "132"
          BINARYEN_SHA256: "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572"
        run: |
          set -euo pipefail
          tag="version_${BINARYEN_VERSION}"
          tarball="binaryen-${tag}-x86_64-linux.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/WebAssembly/binaryen/releases/download/${tag}/${tarball}"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${tag}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-${tag}/bin/wasm-opt" --version

      - uses: extractions/setup-just@v2

      - name: Build WASM crates
        working-directory: wasm
        run: just build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@lelantos-org"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build TypeScript
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
