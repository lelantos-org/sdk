name: Lint

# Split out of `ci.yml`: every check here reads `src/` off the disk and nothing
# else — no `dist/`, no WASM `pkg/`, no Rust toolchain. Keeping them in their
# own workflow means a misplaced `node:` import or a stray `Math.random` fails
# in well under a minute instead of behind a WASM build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps
        with:
          npm-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # biome (format, lint, import order) plus every source check: no bare throws, the tier
      # ladder and entry rules, no `node:` imports or `Math.random` under src/, and literal
      # `#wasm/*` specifiers.
      - name: Checks
        run: npm run check
