# `cargo audit` configuration for the WASM workspace.
#
# These crates compile into the `.wasm` shipped to consumers, so an advisory
# against this lockfile fails CI. Each `ignore` entry needs a stated reason and
# a re-check whenever the dependency that pulls it in is bumped.

[advisories]
ignore = []

# `derivative` (RUSTSEC-2024-0388) and `paste` (RUSTSEC-2024-0436) are
# unmaintained-crate warnings from the arkworks tree. They are reported but do
# not fail the run.
informational_warnings = ["unmaintained", "unsound"]
