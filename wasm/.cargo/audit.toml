# `cargo audit` configuration for the WASM workspace.
#
# The crates here compile into the `.wasm` blobs that ship to consumers, so
# advisories against this lockfile are treated as CI failures. Anything listed
# below is a deliberate, reasoned exception — not a snooze. Re-check each entry
# whenever the dependency that pulls it in is bumped.

[advisories]
ignore = []

# `derivative` (RUSTSEC-2024-0388) and `paste` (RUSTSEC-2024-0436) are
# unmaintained-crate warnings, also from the arkworks tree. They are reported
# but do not fail the run.
informational_warnings = ["unmaintained", "unsound"]
