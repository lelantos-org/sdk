# The only pin of the nightly. rustup applies this file to every cargo
# invocation under `wasm/`, and the workflows read the channel from it.
#
# `rustfmt` and `clippy` are listed so an auto-installed toolchain can run
# `just fmt-check` / `just clippy` without a separate `rustup component add`.
[toolchain]
channel = "nightly-2025-09-01"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
