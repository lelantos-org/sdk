[package]
name = "prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel"]
# `taceo-groth16` depends on rayon unconditionally, so this decides only whether
# a thread pool is started and whether the ark crates use their parallel paths,
# not whether rayon is linked.
parallel = [
    "ark-ff/parallel",
    "ark-groth16/parallel",
    "ark-std/parallel",
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
]
# Measurement build; see `src/trace.rs`. Logs the witness-map/MSM split per
# proof and computes the witness map twice, so it is slower than a release
# build. Not for shipping: `just prover-build` overwrites `pkg/` with a release
# build.
trace = []

[dependencies]
# The prover is `taceo-groth16`. `ark-ec` 0.6 shards an MSM into
# `num_threads / 2` chunks and sizes the Pippenger window from the chunk, not
# the input, so more threads means a smaller window and more bucket work.
# `taceo-groth16` accumulates buckets in affine form with batched inversion and
# runs all five MSMs concurrently.
#
# It uses no `rayon::ThreadPoolBuilder`, only `current_num_threads` and parallel
# iterators, so it works under `wasm-bindgen-rayon`. It supplies
# `ConstraintMatrices`, which `ark-relations` 0.6 lacks, and requires the ark
# 0.6 line.
taceo-groth16 = "0.2.1"
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false }
ark-groth16 = { version = "0.6", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.5"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
byteorder = "1"
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "1"

rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

talc = "5.0.3"
spinning_top = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-bulk-memory", "--enable-threads", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
