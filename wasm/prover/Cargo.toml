[package]
name = "prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel"]
parallel = [
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-groth16/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
]
# Measurement build — see `src/trace.rs`. Times the QAP witness map on its own
# so the MSM block can be read off as the remainder, and logs the split to the
# console. Computes the map twice per proof, so a trace build is slower than a
# release build and its wall-clock numbers are not comparable. Never ship it:
# `just prover-build` overwrites `pkg/` with a clean release build.
trace = []

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.5"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
byteorder = "1"
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "1"

rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

talc = "5.0.3"
spinning_top = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-bulk-memory", "--enable-threads", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
